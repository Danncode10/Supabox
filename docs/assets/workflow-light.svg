<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t">
<title id="t">Workflow: upload, label, export or train, test</title>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#15181d" stroke-opacity="0.06"/>
  </pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#9aa0a8"/>
  </marker>
</defs>
<rect width="1280" height="300" rx="24" fill="#fafbfc"/>
<rect width="1280" height="300" rx="24" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="1279" height="299" rx="23.5" fill="none" stroke="#e2e5e9"/>

<g transform="translate(40 48)">
  <rect width="272" height="204" rx="18" fill="#ffffff" stroke="#e2e5e9"/>
  <rect x="24" y="24" width="4" height="48" rx="2" fill="#2f6fd6"/>
  <text x="40" y="40" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5b616b">STEP 01</text>
  <text x="40" y="70" font-family="Geist, 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#15181d" letter-spacing="-0.6">Upload</text>
  <text font-family="Geist, 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5b616b">
    <tspan x="24" y="118">Admin uploads photos.</tspan><tspan x="24" y="146">HEIC becomes JPEG,</tspan><tspan x="24" y="174">sorted into sections.</tspan>
  </text>
</g>
<line x1="314" y1="150" x2="334" y2="150" stroke="#9aa0a8" stroke-width="2" marker-end="url(#arrow)"/>
<g transform="translate(336 48)">
  <rect width="272" height="204" rx="18" fill="#ffffff" stroke="#e2e5e9"/>
  <rect x="24" y="24" width="4" height="48" rx="2" fill="#4b8a1c"/>
  <text x="40" y="40" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5b616b">STEP 02</text>
  <text x="40" y="70" font-family="Geist, 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#15181d" letter-spacing="-0.6">Label</text>
  <text font-family="Geist, 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5b616b">
    <tspan x="24" y="118">Researchers draw boxes</tspan><tspan x="24" y="146">on phone or laptop.</tspan><tspan x="24" y="174">Every box autosaves.</tspan>
  </text>
</g>
<line x1="610" y1="150" x2="630" y2="150" stroke="#9aa0a8" stroke-width="2" marker-end="url(#arrow)"/>
<g transform="translate(632 48)">
  <rect width="272" height="204" rx="18" fill="#ffffff" stroke="#e2e5e9"/>
  <rect x="24" y="24" width="4" height="48" rx="2" fill="#d9771a"/>
  <text x="40" y="40" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5b616b">STEP 03</text>
  <text x="40" y="70" font-family="Geist, 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#15181d" letter-spacing="-0.6">Export or train</text>
  <text font-family="Geist, 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5b616b">
    <tspan x="24" y="118">Download a YOLOv8 zip</tspan><tspan x="24" y="146">or train on your GPU</tspan><tspan x="24" y="174">in one click.</tspan>
  </text>
</g>
<line x1="906" y1="150" x2="926" y2="150" stroke="#9aa0a8" stroke-width="2" marker-end="url(#arrow)"/>
<g transform="translate(928 48)">
  <rect width="272" height="204" rx="18" fill="#ffffff" stroke="#e2e5e9"/>
  <rect x="24" y="24" width="4" height="48" rx="2" fill="#15181d"/>
  <text x="40" y="40" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5b616b">STEP 04</text>
  <text x="40" y="70" font-family="Geist, 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#15181d" letter-spacing="-0.6">Test</text>
  <text font-family="Geist, 'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5b616b">
    <tspan x="24" y="118">Run the model in your</tspan><tspan x="24" y="146">browser on a photo</tspan><tspan x="24" y="174">or a live camera.</tspan>
  </text>
</g>
</svg>
